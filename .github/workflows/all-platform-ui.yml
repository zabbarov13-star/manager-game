name: Shared interface QA
on:
  pull_request:
    paths: ['ui/**', 'index.html', 'online/**', 'telegram/**', 'packaging/**', 'sw.js', '.github/workflows/all-platform-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix telegram
      - run: cd telegram && npx playwright install --with-deps chromium
      - run: node ui/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-ui-qa
          path: release-output/ui-qa/
