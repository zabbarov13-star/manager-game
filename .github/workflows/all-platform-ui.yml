name: Shared interface QA
on:
  pull_request:
    paths: ['ui/**', 'index.html', 'online/**', 'telegram/**', 'packaging/**', 'sw.js', '.github/workflows/all-platform-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix telegram
      - run: cd telegram && npx playwright install --with-deps chromium
      - run: node ui/qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-ui-qa
          path: release-output/ui-qa/
  desktop:
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node online/generate.cjs
      - run: python packaging/stage-native.py desktop
      - run: npm ci --prefix packaging/desktop
      - name: Launch isolated Electron wrapper twice
        shell: bash
        env:
          MANAGER_SMOKE_PROFILE: ${{ runner.temp }}/manager-stage1-desktop
        run: |
          cd packaging/desktop
          npx electron . --manager-smoke
          MANAGER_SMOKE_REOPEN=1 npx electron . --manager-smoke
  android:
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          node online/generate.cjs
          python3 packaging/stage-native.py android
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon -p packaging/android :app:assembleDebug
          mkdir -p release-output
          cp packaging/android/app/build/outputs/apk/debug/app-debug.apk release-output/Manager-Android-preview.apk
      - name: Enable acceleration on the disposable CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash packaging/android/emulator-smoke.sh
  ios:
    needs: qa
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: |
          node online/generate.cjs
          python3 packaging/stage-native.py ios
          xcodebuild -project packaging/ios/Manager.xcodeproj -scheme Manager -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/manager-stage1-ios" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/manager-stage1-ios/Build/Products/Release-iphonesimulator/Manager.app"
          cmp "$app/game.html" packaging/ios/Manager/game.html
          bash packaging/ios/simulator-smoke.sh "$app"
