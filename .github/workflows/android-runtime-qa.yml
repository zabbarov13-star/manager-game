name: Android runtime QA
on:
  push:
    branches: ['mobile/release-0.19']
    paths: ['.github/workflows/android-runtime-qa.yml']
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Prepare Android image and game
        run: |
          python3 mobile/tools/build-client.py
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-35' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --name ManagerQA --package 'system-images;android-35;google_apis;x86_64' --force
      - name: Install and launch offline
        run: |
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd ManagerQA -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > /tmp/manager-emulator.log 2>&1 &
          python3 mobile/tools/android-ci-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manager-Android-runtime-QA
          path: |
            mobile/out/android-*
            /tmp/manager-emulator.log
