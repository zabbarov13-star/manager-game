name: Manager preview packages
on:
  push:
    branches: ['release/manager-preview-0.19.1']
    paths: ['.github/workflows/manager-preview.yml', 'packaging/**', 'online/**', 'docs/recovery-preview-ru.md']
permissions:
  contents: read
concurrency:
  group: manager-preview-packages
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: |
          node online/generate.cjs
          node --test packaging/test-dice.cjs online/construction.test.cjs online/public.test.cjs
          python3 online/vps/unpack-release.test.py
          bash -n online/vps/install.sh
      - name: Build and verify archives
        run: |
          runtime="$RUNNER_TEMP/node-release"
          mkdir -p "$runtime"
          while read -r sum name; do
            curl -fsSL --retry 3 "https://nodejs.org/dist/v24.22.1/$name" -o "$runtime/$name"
          done < packaging/node-sha256.txt
          (cd "$runtime"; sha256sum -c "$GITHUB_WORKSPACE/packaging/node-sha256.txt")
          python3 packaging/archives.py release-output "$runtime"
          (cd release-output; sha256sum -c SHA256SUMS.txt)
          clean="$RUNNER_TEMP/rebuild"
          unzip -q release-output/Manager-Source.zip -d "$clean"
          (cd "$clean"; node online/generate.cjs)
          cmp online/dist/index.html "$clean/online/dist/index.html"
          cmp online/dist/engine.cjs "$clean/online/dist/engine.cjs"
          cmp online/dist/sw.js "$clean/online/dist/sw.js"
      - uses: actions/upload-artifact@v4
        with:
          name: manager-core
          path: release-output/
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: |
          node online/generate.cjs
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium webkit
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          node packaging/browser-dice.cjs
          QA_WEBKIT=1 node packaging/browser-dice.cjs
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: |
          node online/generate.cjs
          python3 packaging/stage-native.py android
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon -p packaging/android :app:assembleDebug :app:bundleRelease
          mkdir release-output
          cp packaging/android/app/build/outputs/apk/debug/app-debug.apk release-output/Manager-Android-preview.apk
          cp packaging/android/app/build/outputs/bundle/release/app-release.aab release-output/Manager-Android-unsigned.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-output/Manager-Android-preview.apk
          unzip -tq release-output/Manager-Android-preview.apk
          unzip -tq release-output/Manager-Android-unsigned.aab
          unzip -p release-output/Manager-Android-preview.apk assets/index.html | cmp - packaging/android/app/assets/index.html
          unzip -p release-output/Manager-Android-unsigned.aab base/assets/index.html | cmp - packaging/android/app/assets/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: manager-android
          path: release-output/
      - name: Allow the runner to use its emulator accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash packaging/android/emulator-smoke.sh
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: |
          node online/generate.cjs
          python packaging/stage-native.py desktop
      - working-directory: packaging/desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx --no-install electron-builder --win nsis zip --x64 --publish never
      - working-directory: packaging/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MANAGER_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'manager-win-smoke'
          $exe = Resolve-Path 'out/win-unpacked/Manager.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--manager-smoke' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Windows launch failed: $($proc.ExitCode)" }
          $env:MANAGER_SMOKE_REOPEN = '1'
          $proc = Start-Process -FilePath $exe -ArgumentList '--manager-smoke' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Windows save reopen failed: $($proc.ExitCode)" }
          $zip = Resolve-Path 'out/Manager-win-x64.zip'
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP/portable-check"
          if (!(Get-ChildItem "$env:RUNNER_TEMP/portable-check" -Filter Manager.exe -Recurse)) { throw 'Portable ZIP missing Manager.exe' }
      - uses: actions/upload-artifact@v4
        with:
          name: manager-windows
          path: |
            packaging/desktop/out/Manager-win-x64.exe
            packaging/desktop/out/Manager-win-x64.zip
          if-no-files-found: error
  mac:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: |
          node online/generate.cjs
          python3 packaging/stage-native.py desktop
      - working-directory: packaging/desktop
        run: |
          npm ci --no-audit --no-fund
          CSC_IDENTITY_AUTO_DISCOVERY=false npx --no-install electron-builder --mac dmg --arm64 --x64 --publish never
          for image in out/*.dmg; do hdiutil verify "$image"; done
          arch=$(uname -m)
          if [[ "$arch" == arm64 ]]; then dir=mac-arm64; else dir=mac; fi
          export MANAGER_SMOKE_PROFILE="$RUNNER_TEMP/manager-mac-smoke"
          "out/$dir/Manager.app/Contents/MacOS/Manager" --manager-smoke
          MANAGER_SMOKE_REOPEN=1 "out/$dir/Manager.app/Contents/MacOS/Manager" --manager-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: manager-mac
          path: packaging/desktop/out/Manager-mac-*.dmg
          if-no-files-found: error
  ios:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: |
          node online/generate.cjs
          python3 packaging/stage-native.py ios
          xcodebuild -project packaging/ios/Manager.xcodeproj -scheme Manager -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/manager-ios" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/manager-ios/Build/Products/Release-iphonesimulator/Manager.app"
          test -x "$app/Manager"
          cmp "$app/game.html" packaging/ios/Manager/game.html
          bash packaging/ios/simulator-smoke.sh "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Manager-iOS-Simulator.zip"
          unzip -tq "$RUNNER_TEMP/Manager-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: manager-ios-simulator
          path: ${{ runner.temp }}/Manager-iOS-Simulator.zip
          if-no-files-found: error
  release:
    if: always() && needs.core.result == 'success'
    needs: [core, browser, android, windows, mac, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: manager-*
          path: release-output
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          BROWSER: ${{ needs.browser.result }}
          ANDROID: ${{ needs.android.result }}
          WINDOWS: ${{ needs.windows.result }}
          MAC: ${{ needs.mac.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          tag=v0.19.1-preview.3
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          cd release-output
          sha256sum -c SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          {
            echo 'Предварительный выпуск. Действующий OnlineVDS обновляется отдельно.'
            printf '\nКоммит: `%s`\n\n' "$GITHUB_SHA"
            printf 'Браузеры: %s · Android: %s · Windows: %s · Mac: %s · iOS Simulator: %s\n\n' "$BROWSER" "$ANDROID" "$WINDOWS" "$MAC" "$IOS"
            echo 'См. docs/recovery-preview-ru.md и SHA256SUMS.txt. Установки на физических устройствах в CI не проверяются.'
          } > "$RUNNER_TEMP/release-notes.md"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
            gh release upload "$tag" ./* --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" ./* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Менеджер 0.19.1 · предварительная сборка 3" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
