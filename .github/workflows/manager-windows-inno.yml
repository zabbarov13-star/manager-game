name: Rebuild and verify Windows installer
on:
  push:
    branches: ['test/manager-preview-installed-windows']
    paths: ['.github/workflows/manager-windows-inno.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and compile installer
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'zabbarov13-star/manager-game'
          $tag = 'v0.19.1-preview.3'
          $base = Resolve-Path 'packaging/windows'
          $scratch = Join-Path $env:RUNNER_TEMP 'windows-payload'
          New-Item -ItemType Directory $scratch | Out-Null
          gh release download $tag -R $repo --dir $scratch --pattern 'Manager-win-x64.zip' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $zip = Join-Path $scratch 'Manager-win-x64.zip'
          $line = Get-Content (Join-Path $scratch 'SHA256SUMS.txt') | Where-Object { $_.EndsWith('  Manager-win-x64.zip') }
          if ((Get-FileHash $zip).Hash.ToLower() -ne $line.Split(' ')[0]) { throw 'Wrong payload checksum' }
          Expand-Archive -LiteralPath $zip -DestinationPath $scratch/expanded
          $app = Get-ChildItem "$scratch/expanded" -Filter 'Manager.exe' -Recurse | Select-Object -First 1
          if (!$app) { throw 'Missing Manager.exe' }
          Copy-Item -Recurse -LiteralPath $app.Directory.FullName -Destination "$base/payload"
          $tool = Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue
          if ($tool) { $compiler = $tool.Source } else { $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $compiler "$base/Manager.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - name: Run downloaded application and perform two installs
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Resolve-Path 'packaging/windows'
          $app = Get-Item "$base/payload/Manager.exe"
          function Invoke-Checked($path, $arguments) {
            $process = Start-Process -FilePath $path -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(65000)) {
              Stop-Process -Id $process.Id -Force
              throw "Timed out: $path"
            }
            if ($process.ExitCode -ne 0) { throw "$path exited with $($process.ExitCode)" }
          }
          $exe = "$base/out/Manager-win-x64.exe"
          $target = Join-Path $env:RUNNER_TEMP 'manager-installed'
          $env:MANAGER_SMOKE_PROFILE = Join-Path $env:RUNNER_TEMP 'manager-installed-profile'
          for ($i = 0; $i -lt 2; $i++) {
            Invoke-Checked $exe @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target","/LOG=$env:RUNNER_TEMP\inno-$i.log")
            $env:MANAGER_SMOKE_REOPEN = "$i"
            Invoke-Checked "$target/Manager.exe" @('--manager-smoke')
          }
          Invoke-Checked $app.FullName @('--manager-smoke')
          Write-Host ('Authenticode: ' + (Get-AuthenticodeSignature $exe).Status)
          Write-Host 'Installer, repeat installation with saved state, and portable ZIP verified.'
          Compress-Archive "$base/Manager.iss" "$base/out/Manager-Windows-Installer-Source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: manager-windows-verified-installer
          path: packaging/windows/out/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manager-windows-verified-installer
          path: out
      - run: |
          set -euo pipefail
          repo=zabbarov13-star/manager-game
          tag=v0.19.1-preview.3
          test "$(git ls-remote "https://github.com/$repo.git" "refs/tags/$tag" | cut -f1)" = '8a11befa612da2fdfa90ceceb4b6ddd97d8827e9'
          cd out
          gh release download "$tag" -R "$repo" -p SHA256SUMS.txt
          grep -Fqx '5d13fdb4ef734abeb29ea7801c6a7d0d832cec2b96cb243ff2c6f2b8e94ed01b  Manager-win-x64.exe' SHA256SUMS.txt || exit 0
          sed -i '/  Manager-win-x64\.exe$/d' SHA256SUMS.txt
          sha256sum Manager-win-x64.exe Manager-Windows-Installer-Source.zip >> SHA256SUMS.txt
          gh release upload "$tag" -R "$repo" Manager-win-x64.exe Manager-Windows-Installer-Source.zip SHA256SUMS.txt --clobber
          gh release view "$tag" -R "$repo" --json body -q .body > notes.md
          printf '\nWindows EXE пересобран через Inno Setup из проверенного портативного ZIP. Установка, повторная установка с сохранением данных и запуск из ZIP прошли на Windows. Подпись Authenticode отсутствует. Исходник установщика входит в Manager-Windows-Installer-Source.zip.\n' >> notes.md
          gh release edit "$tag" -R "$repo" --notes-file notes.md
