name: P2P routing baseline
on:
  pull_request:
    paths:
      - index.html
      - tests/p2p-routing-baseline.cjs
      - .github/workflows/p2p-baseline.yml
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/p2p-routing-baseline.cjs
